[project]
name = "model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Han", email = "jsh562@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "arviz>=1.2.0",
    "gateway",
    "jsonschema[format-nongpl]>=4.26.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.24.1",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pymc>=6.2.0",
    "pysbd>=0.3.4",
    "reportlab>=5.0.0",
    "sqlalchemy>=2.0.51",
    "tokenizers>=0.23.1",
]

# ADR-0011: every job this entry owns is a console entry point invoked through
# the entry's own environment -- `uv run --directory src/model <name>` -- rather
# than a container job. A context rooted at src/model could not resolve the
# `gateway` path dependency below, and widening it to ./src would admit the
# modeling boundary into the serving build context. docker-compose.yml is
# untouched (TR-037).
#
# `migrate` arrived with the schema epic and the four corpus commands with the
# corpus epic; they are unrelated jobs that happen to share one entry, so both
# sets are declared here rather than either replacing the other. The three
# `procurement-*` commands arrived with E005 and follow the same split the
# corpus epic established -- one verb per job, `<domain>-<verb>`, no subcommand
# dispatcher -- so a workflow step names the job it runs.
#
# E005 adds no dependency: the generator draws with the NumPy already declared
# above, the loader uses the declared psycopg, and everything else it needs is
# stdlib or a package this entry already ships (`model.roster`, `model.corpus`).
#
# E006 adds four, and each is a runtime dependency of the ingestion job rather
# than tooling:
#
#   onnxruntime  {SAD:ADR-0018} pins the inference runtime for corpus and query
#                embedding. FP32 export, per AD-014 -- ADR-0012 budgets roughly
#                80 MB for full-precision weights, and INT8 would change the
#                vectors every published retrieval figure is measured on.
#   tokenizers   The encoder's own tokenizer, standalone. Chunk sizes are
#                measured in the encoder's word pieces against the 254-piece
#                content budget (HINT-001), so counting with anything else
#                measures a different thing than the model consumes. Declared
#                without `transformers`: the tokenizer is all that is needed and
#                the full library would pull a second inference stack in beside
#                ONNX Runtime.
#   pysbd        The pinned terminal sentence split below a paragraph, with
#                character spans kept so every sentence maps back to an offset
#                in its parent unit and page containment still holds.
#   pgvector     The psycopg 3 adapter, needed to bulk-load embeddings through
#                `cursor.copy()`. Not a second client -- it registers vector
#                types on the psycopg connection already declared above.
#
# `ingest` joins the console entries under the same one-verb-per-job rule the
# corpus and procurement commands follow. It is the only entry point of the
# ingestion job, and it is offline in both its modes (FR-044, FR-045).
[project.scripts]
migrate = "model.schema.cli:main"
corpus-retrieve = "model.corpus.retrieve:main"
corpus-generate = "model.corpus.generate:main"
corpus-validate = "model.corpus.validate:main"
corpus-reverify = "model.corpus.reverify:main"
procurement-generate = "model.procurement.generate:main"
procurement-load = "model.procurement.load:main"
procurement-validate = "model.procurement.validate:main"
ingest = "model.ingest.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
gateway = { path = "../gateway" }

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "hypothesis>=6.161.5",
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-alembic>=0.12.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

# AD-003: security QC lives inside the lint category, not a third category.
# `assert` is the test framework's assertion mechanism, so S101 is noise there.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest's scratch inside the checkout. Without this it derives its base
# temp from `tempfile.gettempdir()`, which on Windows is %LOCALAPPDATA%\Temp —
# where a build's unsigned compiler probes and a 1 GB throwaway environment
# once tripped the machine's antivirus as a dropper. `.tmp/` is gitignored, and
# pytest clears its own basetemp at start, so nothing else may live there.
# Belt and braces with the TMPDIR rule in AGENTS.md: this holds even when a
# command is run without it.
#
# Suffixed with the tier's own name because pytest clears its basetemp at the
# start of every run: four tiers sharing one directory is safe only while they
# are sequential, and two run concurrently wipe each other's `tmp_path`
# mid-run. See the root manifest for the full note.
addopts = "--basetemp=../../.tmp/pytest-model"

[tool.coverage.run]
branch = true
source = ["src/model"]

[tool.importlinter]
root_package = "model"
# Required by the corpus contract below: `gateway` sits outside the `model` root
# package, and import-linter refuses to name an external module as forbidden
# unless the graph is built with external packages in it. Without this the
# contract is not merely weaker — it fails to load at all.
include_external_packages = true

# TR-009: model-facing code must never reach deterministic computation.
# Indirect detection stays ON here — laundering the dependency through an
# intermediate module is exactly the evasion this contract exists to catch.
[[tool.importlinter.contracts]]
name = "Model-facing code does not reach the computation package"
type = "forbidden"
source_modules = ["model.llm"]
forbidden_modules = ["model.compute"]
allow_indirect_imports = false

# FR-022: corpus generation completes with no language-model invocation. Stated
# as a build-gating contract rather than an assertion, so the offline claim is
# enforced on every commit instead of being re-argued per review. `gateway` is
# named alongside `model.llm` because reaching the provider through the shared
# client is the same violation by another route. Indirect detection stays ON:
# laundering the dependency through an intermediate module is the evasion.
[[tool.importlinter.contracts]]
name = "Corpus code does not reach the model provider"
type = "forbidden"
source_modules = ["model.corpus"]
forbidden_modules = ["model.llm", "gateway"]
allow_indirect_imports = false

# FR-050 / Principle VIII: the baseline extractor is an honest opponent, and it
# is only honest if it was authored from the *rendered* documents alone. The
# corpus generator holds the per-vendor templates, the renderer, and the
# pre-render document model -- the three things that say what each document was
# built to contain. A baseline reading any of them is not extracting from a
# document, it is reading the answer key, and every quality figure published
# beside it would flatter the model against an opponent that cannot lose.
#
# Stated as a build-gating contract rather than a code-review convention for the
# same reason the two above are: the claim "the baseline is independent" is what
# FR-050's *declared* label rests on, and that label is fixed before any figure
# exists. A claim fixed in advance and checked by nobody is the one that quietly
# stops being true.
#
# Scoped to `model.ingest.baseline` rather than `model.ingest`: the rest of the
# ingestion package legitimately reads the corpus -- the manifests, the derived
# page text, `corpus.paths.resolve_within` -- and forbidding the package wholesale
# would forbid the job from reading the documents it ingests.
#
# The three forbidden modules are named individually rather than as `model.corpus`
# for the same reason. `templates` is the per-vendor generation source, `render`
# turns a document model into the PDF, and `model` is the pre-render document
# model itself; those are the answer key. Indirect detection stays ON -- reaching
# the templates through `corpus.generate` is the same violation by one more hop,
# and it is the shape the evasion would actually take.
[[tool.importlinter.contracts]]
name = "The baseline extractor does not reach the corpus generator"
type = "forbidden"
source_modules = ["model.ingest.baseline"]
forbidden_modules = [
    "model.corpus.templates",
    "model.corpus.render",
    "model.corpus.model",
]
allow_indirect_imports = false
