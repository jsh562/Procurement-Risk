[project]
name = "model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Han", email = "jsh562@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.2.0",
    "gateway",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pymc>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
gateway = { path = "../gateway" }

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "hypothesis>=6.161.5",
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/model"]

[tool.importlinter]
root_package = "model"

# TR-009: model-facing code must never reach deterministic computation.
# Indirect detection stays ON here — laundering the dependency through an
# intermediate module is exactly the evasion this contract exists to catch.
[[tool.importlinter.contracts]]
name = "Model-facing code does not reach the computation package"
type = "forbidden"
source_modules = ["model.llm"]
forbidden_modules = ["model.compute"]
allow_indirect_imports = false
