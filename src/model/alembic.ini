# Alembic configuration for the modeling entry.
#
# ADR-0013: /src/model owns every migration and is the only entry declaring a
# database client. Nothing here may be duplicated into /src/api or /src/gateway.
#
# TR-008: the assets live in /src/model. The ini sits at the entry root so the
# entry's own tooling finds it, but the migration environment and the version
# scripts live *inside* the package (src/model/schema/), not beside this file,
# so they ship with the installed distribution rather than only with a checkout.

[alembic]

# Absolute, via %(here)s (this file's directory, src/model). Not relative:
# Alembic resolves a relative script_location against the *current working
# directory*, which would make `alembic -c alembic.ini` behave differently
# depending on where it was invoked from.
#
# Points at the package directory holding env.py and script.py.mako.
script_location = %(here)s/src/model/schema

# Defaults to <script_location>/versions, but stated explicitly so the location
# of the chain is readable from the config rather than inferred.
version_locations = %(here)s/src/model/schema/versions

# Splitting character for version_locations and prepend_sys_path.
# "newline" rather than the template default "os": on Windows os.pathsep is ";"
# and the legacy fallback splits on spaces and colons, either of which would
# tear an absolute path such as S:\...\versions in half at the drive letter.
path_separator = newline

# TR-004: filename prefixes 0001-0099 are this epic's reserved block (E004 owns
# 0100-0199). Alembic has no sequential-counter token, so the four-digit prefix
# is carried as the revision id itself and emitted by %%(rev)s:
#
#     alembic -c alembic.ini revision --rev-id 0003 -m "document"
#         -> src/model/schema/versions/0003_document.py
#
# The prefix remains a labelling convention only. Ordering is Alembic's, via
# each revision's down_revision pointer -- the numbers are never compared to
# decide what runs next, so a gap or an out-of-order id is a naming defect and
# not a broken chain. test_migration_chain.py (T011) asserts single head and
# in-range prefixes; it is the check, not this template.
file_template = %%(rev)s_%%(slug)s

# 40 truncates descriptive slugs mid-word; the four-digit prefix and separator
# already consume five characters of the filename.
truncate_slug_length = 60

# The package is installed into the entry's environment, so `model` imports
# without help. This entry exists for the case where migrations are run from a
# bare checkout, and costs nothing when the install is present.
prepend_sys_path = %(here)s/src

# NOTE: `sqlalchemy.url` is deliberately absent.
#
# env.py reads the URL from the DATABASE_URL environment variable and fails if
# it is unset. A URL here would be a committed credential (Ruff S105/S106) and
# would silently win in whichever environment forgot to export the variable --
# including CI, whose host and port differ from the local Compose service.

# Logging. Consumed by env.py via logging.config.fileConfig.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
