x-covariates-admitted:
  description: |
    Orientation only, not a constraint. FR-032 makes `forecast_run.covariate_names` the arbiter of what
    entered a fit, and `Covariate.name` is a projection of that column. These are the three the
    delivered model records today; a run recording a fourth would publish it, and closing the set in
    this contract would put the arbitration in the wrong place.
  names: [lifecycle_state, days_in_state, approval_cycle_count]
