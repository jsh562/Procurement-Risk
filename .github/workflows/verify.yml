name: verify

# All three triggers, deliberately.
#
# `push` is what makes the architecture contracts real: a violation fails the
# build rather than raising a review comment. This was originally deferred to a
# later epic as a scope decision, then closed here once the analyze phase made
# the cost visible — it is one line.
#
# `pull_request` (FR-034) makes the merge gate authoritative: a push run and a
# pull-request run may cover the same head commit, but they are independent runs
# scoped by ref, and the pull-request one is what judges the merge.
#
# `pull_request` and NOT `pull_request_target` (FR-034a(b)). The two are not
# interchangeable spellings: `pull_request_target` runs the *base* ref's
# workflow definition with the base repository's token and secret access while
# checking out head content, which is a different execution surface from the one
# FR-034a states. What runs here is the proposed head content under a
# `contents: read` token with no secret in reach (FR-034a(a), (c)), so the
# reachable consequence of a hostile head is bounded to a wrong verdict on its
# own pull request. tests/checks/test_workflow_triggers.py asserts all three of
# those properties against this file.
#
# `workflow_dispatch` remains because the violation-injection input below is
# on-demand evidence, not something to run on every push.
on:
  push:
    # `specs/**` was ignored here on the grounds that "nothing under tests/,
    # src/*/tests/, or the check harness reads specs/ — verified before adding
    # this rather than assumed." That was true when it was written and is not
    # true now: E003 added five model tests that read
    # specs/00003-core-data-schema/data-model.md through a hard-coded path and
    # assert against its contents — test_table_ownership, test_constants_agreement,
    # test_constraint_audit, test_extraction, test_resolved_entity. A specs-only
    # edit can therefore fail the suite, and the ignore meant a specs-only push
    # to a branch reported no verdict at all.
    #
    # `pull_request` below carries no path filter, so the merge gate was never
    # exposed; the gap was pushes. Rather than restate the justification with an
    # exception list, the ignore is dropped — the comment's own standard was
    # "verified rather than assumed", and the cheapest way to keep that true is
    # to stop depending on a claim that has already gone stale once. A specs-only
    # push now costs one run.
    #
    # README.md stays ignored: nothing reads or asserts it. Deliberately NOT
    # `**.md` — data/roster/roster-datasheet.md is asserted by
    # src/model/tests/test_roster_datasheet.py for its required sections, the
    # literal SYNTHETIC token, and VR-016's no-literal-digest rule. A blanket
    # Markdown ignore would silently stop verifying a file that is under test.
    paths-ignore:
      - "README.md"
  # Against the default branch, named explicitly rather than left to the
  # `pull_request` default of "any base ref" — FR-034 states the base, and the
  # committed trigger check reads this list to assert it.
  #
  # No `paths-ignore` here, unlike `push` above, and the asymmetry is the point.
  # A skipped push run costs nothing; a pull-request run that is skipped by path
  # filtering reports no status at all, and a required check with no status
  # leaves the pull request pending forever rather than passing. The merge gate
  # therefore runs on every pull request, including a specs-only one.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      inject_violation:
        description: "Plant a contract violation to evidence the checks fail"
        type: choice
        required: false
        default: none
        options:
          - none
          - provider-import
          - computation-boundary

permissions:
  contents: read

# When commits land close together on one ref, the older run is verifying code
# that no longer exists. Grouped by ref so `main` and a feature branch never
# cancel each other.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build environment sits behind TLS interception; without this every
  # index request fails with UnknownIssuer rather than a network error.
  UV_NATIVE_TLS: "1"
  # import-linter renders an emoji through `rich`. On Windows with a non-TTY
  # stdout, rich falls back to a cp1252 legacy console encoder, raises
  # UnicodeEncodeError, and exits 1 with no visible output — a passing contract
  # that reports as broken. Linux runners are unaffected, so this is set for
  # anyone reusing these steps on a Windows runner rather than for CI itself.
  PYTHONUTF8: "1"

jobs:
  verify:
    runs-on: ubuntu-latest

    # `project-instructions.md` v1.2.5: scratch stays inside the checkout.
    #
    # Identical to the three lines the `reproduce` job below carries, and the
    # asymmetry between the two jobs is what made this a finding rather than a
    # preference — one job honoured the rule and the other, the one running
    # every build, lint, sync and test step in the repository, did not. This is
    # the layer that covers everything pytest's `--basetemp` cannot: `uv`'s
    # build and unpack scratch, `npm`'s, `docker build`'s context staging, and
    # the unsigned feature-probe executables a compiler emits while resolving a
    # source distribution — the exact class of artifact the amendment was
    # raised by.
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      TEMP: ${{ github.workspace }}/.tmp
      TMP: ${{ github.workspace }}/.tmp
      # v1.2.6, narrowed by v1.2.8: Numba keeps private scratch that `tempfile`
      # and the three above never reach. PyTensor's `base_compiledir` is
      # deliberately NOT redirected — it holds a compiled C++ extension, not
      # scratch, and pinning it made every checkout rebuild the same binary.
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.tmp/numba

    # The model entry's schema tests assert constraint rejection, index presence,
    # and deferred-constraint behaviour at commit. All three are enforced by the
    # server, so there is nothing a fake or an in-process engine could stand in
    # for — the tests need a real PostgreSQL with pgvector.
    #
    # The image reference is copied byte-for-byte from the Compose `db` service
    # (AD-001). One image, one digest, one source of truth: a CI database that
    # has drifted from the local one turns a green build into a statement about
    # a different server than the developer ran against. Update the pin in
    # docker-compose.yml and copy it here; never the other way round.
    #
    # Structural note: service containers are job-scoped by GitHub Actions'
    # design — there is no way to attach one to a subset of steps. Giving only
    # the model entry a database therefore means a second job, which costs an
    # extra runner plus its own checkout and `uv sync`, and splits
    # `.coverage.model` away from `.coverage.checks` so the coverage gate below
    # could no longer combine them without artifact upload/download. A Postgres
    # container idling through the web build is by far the cheaper of the two,
    # so the service stays on this job.
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          # TR-015: the same literal development-only credentials the Compose
          # service commits on purpose, declared non-secret there and here. The
          # container is reachable only from this job's steps, and matching the
          # values keeps one DATABASE_URL shape across local and CI.
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: procurement
        # 5432 on the runner, against Compose's 5434 on a developer's host — the
        # local port dodges a collision that does not exist here. Tests read
        # DATABASE_URL rather than a port precisely because the two differ.
        ports:
          - 5432:5432
        # Equivalent to the Compose service's pg_isready check. Without it the
        # job starts its steps against a server still initialising its data
        # directory, and the first schema test fails on a refused connection
        # that has nothing to do with the schema.
        options: >-
          --health-cmd "pg_isready -U procurement -d procurement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Before the first tool runs, because `TMPDIR` pointing at a directory
      # that does not exist is worse than not setting it: a runner starts with
      # no `.tmp/` (it is gitignored, so the checkout does not create one) and
      # the first tool to open a temporary file would fail with a path error
      # that names neither this variable nor the rule behind it.
      - name: Create the checkout's scratch directory
        run: mkdir -p "$TMPDIR"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The violation is written into the checked-out working tree of an
      # ephemeral runner and never committed — TR-022's prohibition is on
      # committing a violation to a production contract root, which would make
      # the clean-tree run fail permanently, not on materialising one at runtime.
      #
      # It is written into the production root deliberately rather than a
      # scratch copy: the contracts run against the real root, so a violation
      # placed anywhere else would not be seen and the run would pass, proving
      # nothing. An earlier comment here claimed a scratch copy that did not
      # exist; the mechanism is described accurately now.
      - name: Plant violation in the runner's working tree (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_violation != 'none' }}
        run: |
          set -euo pipefail
          # Each payload must be lint-clean while still breaking its contract.
          # A bare `import anthropic` is F401 (imported but unused), so ruff
          # fails three steps before the contracts run and the dispatch names
          # "Lint (Python)" instead of the violated contract — a run that fails
          # for the wrong reason is not evidence that the contract works.
          # The `__all__` line is what makes the import "used".
          case "${{ inputs.inject_violation }}" in
            provider-import)
              target=src/gateway/src/gateway/_injected.py
              printf 'import anthropic\n\n__all__ = ["anthropic"]\n' > "$target" ;;
            computation-boundary)
              target=src/api/src/api/llm/_injected.py
              printf 'from api import compute\n\n__all__ = ["compute"]\n' > "$target" ;;
          esac
          echo "Planted violation at $target"
          # Confirm the file exists rather than asking git. The injected file is
          # untracked, `git diff` does not report untracked files, so a
          # `git diff --quiet` guard fires on the success path and kills the
          # step — the dispatch evidence path would fail at injection and never
          # reach the contracts it exists to trip.
          test -s "$target" || { echo "::error::injection wrote nothing to $target"; exit 1; }

      # The gateway is synced with its `provider` extra and the other entries
      # without any, and that asymmetry is the point rather than an oversight.
      # ADR-0014 made the provider SDK optional, so a plain `uv sync` resolves
      # the gateway *without* it — which would leave the gateway's own provider
      # tests unable to load a client and its type check unable to resolve the
      # import, both failing for the absence of a dependency the entry is
      # entitled to. The gateway is the one entry entitled to it.
      #
      # The environment that must NOT have it is built separately and
      # deliberately, by `tests/checks/test_gateway_no_provider_env.py` — that
      # is the check carrying OBJ1 VC1, and it constructs its own environment
      # precisely because no entry's own sync can stand in for one.
      - name: Sync every Python entry against its own lockfile
        run: |
          uv sync --locked --extra provider --directory src/gateway
          for entry in api model; do
            uv sync --locked --directory "src/$entry"
          done
          uv sync

      # Separate step with working-directory rather than `npm ci --prefix`:
      # `npm ci` rejects --prefix outright with a usage error, which fails the
      # step before any check runs and reads as a broken build rather than a
      # broken command line.
      - name: Sync the web boundary against its lockfile
        working-directory: src/web
        run: npm ci

      - name: Lock verification
        run: |
          for entry in gateway api model; do uv lock --check --directory "src/$entry"; done

      - name: Lint (Python)
        run: |
          for entry in gateway api model; do uv run --directory "src/$entry" ruff check .; done
          uv run ruff check .

      # The root is listed alongside the loop for the same reason the Lint step
      # above lists it: it is not one of the three entries, so a per-entry loop
      # silently omits it. It was omitted — root linting was enforced and root
      # formatting was not, leaving everything under `/tests` format-unchecked:
      # the 22 modules of `tests/checks` and the 41 import-linter negative
      # fixtures under `tests/fixtures`, 403 files at the root against the
      # entries' 243. `tests/checks/test_lint_and_format_cover_the_same_tiers.py` now
      # asserts the two steps cover the same set, so the class of omission fails
      # a build rather than waiting for the next reader.
      - name: Format check (Python)
        run: |
          for entry in gateway api model; do
            uv run --directory "src/$entry" ruff format --check .
          done
          uv run ruff format --check .

      - name: Lint and format check (web)
        working-directory: src/web
        run: |
          npm run lint
          npx prettier --check .

      - name: Type check (web)
        working-directory: src/web
        run: npx tsc --noEmit

      # `project-instructions.md` v1.2.4. Scoped to the gateway, and the scope is
      # in the step name rather than only in the policy: `api` and `model` are
      # not annotated to a standard strict mypy would accept, and a step named
      # "Type check (Python)" that ran over one entry would read as covering all
      # three. The scope widens when those entries are annotated, not before.
      - name: Type check (gateway)
        run: uv run --directory src/gateway mypy src

      - name: Architecture contracts
        run: |
          for entry in gateway api model; do uv run --directory "src/$entry" lint-imports; done

      # TR-007 / ADR-0011: the migration runner is reached as a console entry
      # point through the modeling entry's own environment, so it appears here as
      # `uv run --directory src/model` like every other Python step rather than
      # as a `docker compose run` of a job container. There is no image to build
      # and no Compose service to start; determinism comes from the entry's
      # lockfile, which the sync step above already enforced with `--locked`.
      #
      # Placed before the model tests, not after: the schema tests query a
      # migrated database, so an unapplied chain fails them on missing relations
      # rather than on anything they assert. Applying it here rather than from a
      # session fixture also means the chain is exercised exactly as a developer
      # or a deployment runs it, and a failure names this step instead of
      # surfacing as a collection error inside pytest.
      #
      # The same DATABASE_URL literal as the step below — the runner's service
      # container publishes 5432, against Compose's 5434 on a developer's host.
      # It is repeated rather than hoisted to the job's `env:` because only these
      # two steps touch a database, and a job-wide URL would silently point the
      # web and image steps at one too.
      - name: Apply the migration chain (model)
        env:
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
        run: uv run --directory src/model migrate

      # Each entry writes its own coverage data file. pytest-cov overrides the
      # `parallel` setting, so the files are kept apart by COVERAGE_FILE rather
      # than by configuration, and combined at the root below.
      - name: Unit tests (model)
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.model
          # The schema tests read this from the environment and never hardcode a
          # port: it is 5432 here and 5434 against the Compose service on a
          # developer's host.
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
          # Turns an unset DATABASE_URL from a skip into a refusal to start.
          # Without it, deleting the line above would leave 344 of the suite's
          # 425 tests skipped and this step still green — measured, not feared.
          # Redundant with the `CI` variable the runner sets, which the same
          # check already honours; stated anyway so the demand is visible next
          # to the value it demands, and so a runner that does not set `CI`
          # (`act`, a bare self-hosted script) is still covered.
          REQUIRE_DB: "1"
        working-directory: src/model
        # --source overrides the root pyproject.toml `source` list rather than
        # merging with it, so every package in that list must appear here too or
        # it lands in the denominator with no hits. Eight packages now: roster
        # from the scaffold, corpus from E002, schema from E003, procurement
        # from E005, ingest, llm and compute from E006, and forecast from E007.
        # Each epic widened this line independently and the union is what is
        # correct — dropping any package would put it in the denominator
        # uncovered and drag the gate down while measuring nothing.
        #
        # An *absent* package is the direction that hurts more: it is not
        # measured at all rather than measured badly, so a list left short makes
        # every line of the epic that added the package invisible to the gate
        # below — a green 80% that says nothing about the code just added.
        #
        # `forecast` proved that rather than restating it. E007's T001 made both
        # root `pyproject.toml` edits — the `source` entry and the
        # `[tool.coverage.paths]` mapping — and this inline list, which overrides
        # the first of them, was left at four. `tests/forecast` ran on every CI
        # run while the package it exercises was uncounted, so the two halves of
        # T001 bought nothing on the only run that gates (T111). E006 and E007
        # each extended this line on their own branch, against the same
        # four-package baseline; the merge is the union and neither side's
        # packages may be dropped to resolve it.
        run: uv run coverage run --source=src/model/roster,src/model/schema,src/model/corpus,src/model/procurement,src/model/ingest,src/model/llm,src/model/compute,src/model/forecast -m pytest tests -q

      # E005's release gate. Each command below is a checkable claim about the
      # committed dataset, and each fails the build rather than warning:
      #
      #   procurement-validate  regenerates from the recorded seed and compares
      #                         the digest (DV-015), recomputes all three
      #                         generation-input digests each under its own
      #                         convention (DV-016), checks the datasheet's seven
      #                         sections and its limitation records (DV-019), and
      #                         checks the ground-truth record binds to this
      #                         fixture and covers the roster (DV-017).
      #
      # The isolation, emitted-artifact-set, report-conformance and corpus-field
      # checks run as tests rather than as a second entry point, because each is
      # an assertion about the repository tree rather than an operation on it —
      # and running them here as well as in the suite would be two places for one
      # rule to be stated.
      - name: Procurement dataset release gate
        env:
          # The same step-scoped literal the migration and coverage steps carry,
          # and step-scoped for the reason stated there: a job-wide URL would
          # point the web and image steps at a database too.
          #
          # Required even though none of the four checks below touches one.
          # `tests/procurement/conftest.py::pytest_configure` turns `CI` set with
          # `DATABASE_URL` unset into a hard abort *before collection*, so
          # omitting this killed all four invocations on the first CI run — the
          # release gate failing for a reason unrelated to anything it gates.
          #
          # `REQUIRE_DB: "0"` would also silence it and is the wrong fix: it
          # makes a claim about the tier rather than about these four files, and
          # would silently cover a future gate check that does need a database.
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
        working-directory: src/model
        run: |
          uv run procurement-validate
          uv run pytest -q tests/procurement/test_ground_truth_isolation.py
          uv run pytest -q tests/procurement/test_emitted_artifact_set.py
          uv run pytest -q tests/procurement/test_gate_discharged.py
          uv run pytest -q tests/procurement/test_corpus_match_fields.py

      # E007's release gate (T113). Four checkable claims about the forecast
      # tier, each failing the build rather than warning:
      #
      #   emitted-set equality  every file the fit and reproduction jobs write is
      #                         an instance of one of FR-040's three declared
      #                         kinds, as an equality rather than a containment
      #                         (SC-035, DV-041).
      #
      #   reportable unit       every measure with a decision criterion is
      #                         reported as measure, realized value, criterion
      #                         with its direction, and verdict — over the
      #                         emitted reports and the stored diagnostic rows —
      #                         and the wall clock carries none (SC-034, DV-039).
      #                         Its controls run beside it: an absence check with
      #                         no planted positive is green when it finds
      #                         nothing (NC-20).
      #
      #   import contract       the modeling entry's `model.forecast` contract
      #                         evidenced in its failing direction by two planted
      #                         imports (NC-15), and the conjunct no entry owns —
      #                         no request-time entry point reaches the fit over
      #                         the transitive closure (DV-022, SC-021).
      #
      #   migration ranges      `0300`-`0399` is E007's declared block; the
      #                         partition check is what keeps the directory
      #                         tiled without overlap as each epic claims one
      #                         (TR-018, TR-051).
      #
      # The forecast files run as ONE pytest invocation rather than one each, and
      # that differs from E005's gate above deliberately: this tier's fixtures
      # emit a real `forecast-fit` and a real `forecast-reproduce`, both
      # package-scoped, so five invocations would sample five times over. E005's
      # four checks share no fixture and cost nothing to separate.
      #
      # **No `procurement-load` step precedes this**, and none is added: CI runs
      # `pytest tests` after `migrate` alone, and the model test step above
      # leaves `purchase_order_line` empty because `tests/procurement` empties it
      # in teardown by design. The forecast tier's `committed_dataset` fixture
      # loads the committed dataset through the same `load()` the console entry
      # calls whenever the table is empty, so the gate relies on that fixture
      # rather than on a step — one place that establishes the precondition
      # instead of two that can disagree about it.
      - name: Forecast model release gate
        env:
          # Step-scoped, and ABOVE `run:` — E005's gate learned both halves. The
          # scoping is for the reason the migration and coverage steps carry
          # their own: a job-wide URL would point the web and image steps at a
          # database too. The placement is because
          # `tests/forecast/conftest.py::pytest_configure` turns `CI` set with
          # `DATABASE_URL` unset into a hard abort *before collection*, exactly
          # as the procurement tier's does, so a swallowed `env:` block kills
          # every invocation below for a reason unrelated to what it gates.
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
          # Redundant with the runner's own `CI`, stated anyway so the demand is
          # visible beside the value it demands and a runner that does not set
          # `CI` is still covered.
          REQUIRE_DB: "1"
        run: |
          uv run --directory src/model pytest -q tests/forecast/test_emitted_set.py tests/forecast/test_reportable_unit.py tests/forecast/test_reportable_unit_controls.py tests/forecast/test_import_contract_controls.py
          uv run pytest -q tests/checks/test_dependency_isolation.py
          uv run pytest -q tests/checks/test_migration_ranges.py

      # FR-017: corpus validation runs automatically, not on demand. The console
      # entry point is the same one a developer runs, so a green CI run and a
      # green local run are the same assertion.
      #
      # **Unscoped, deliberately.** This step carried `--layer REAL` while the
      # synthetic layer did not exist, because VR-005 and VR-066 are built to
      # fail on a corpus missing it — that is their entry-criterion job, not a
      # defect to suppress. The layer landed with T056's single generation run,
      # and the flag came off in the same change: left in place it would make
      # the required check silently blind to all 25 synthetic documents and to
      # the seventeen rules asserted only over them.
      - name: Corpus validation
        run: uv run --directory src/model corpus-validate

      # The gateway holds the single permitted provider import site. Its tests
      # existed but no step ran them, so OBJ7's "every check runs" was false
      # for the most load-bearing module in the repository.
      #
      # Under `coverage run` since E003's QC: `provider.py` is named in the root
      # `[tool.coverage.run] source` list, so without a data file from this step
      # its statements would sit in the denominator with zero hits and drag the
      # gate down while looking like untested code. Its own COVERAGE_FILE, like
      # the two steps above, because `combine` merges by file.
      - name: Unit tests (gateway)
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.gateway
          # E004 T032: `test_migrations.py` drives E003's runner at a throwaway
          # database to verify TR-017's apply-from-empty and TR-050's
          # re-runnable postcondition. Without this it skips — and a skipped
          # tier reporting as a pass is the exact failure E003 measured and
          # documented. `src/gateway/tests/conftest.py` turns the unset variable
          # into a refusal to start, but only if a database was meant to be
          # there, which is what this line says.
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
        run: uv run --directory src/gateway coverage run -m pytest tests -q

      # FR-040. Until E010 there was no api step at all — the entry was synced,
      # linted, contract-checked and built into the serving image, and its tests
      # were never executed anywhere. A tier that exists and does not run is
      # worse than one that is absent, because the plan reads as though it is
      # covered.
      - name: Unit tests (api)
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.api
          # The worklist reads real tables. Its integration tier asserts the
          # eight degraded states against a seeded database, and every one of
          # them is a statement about what the server returns rather than what a
          # fake would.
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
        # `-m "not benchmark"` because the benchmark tier has its own step
        # below, under a CPU limit this one does not apply. Running it here as
        # well would take minutes and measure the wrong machine.
        run: uv run --directory src/api coverage run -m pytest tests -q -m "not benchmark"

      - name: Unit tests (web)
        working-directory: src/web
        run: npm test

      # FR-032's presentation contract — type scale, reading order, the as-of
      # date without hover, the live region — is a property of a laid-out page
      # and of a real accessibility tree, neither of which jsdom provides. The
      # step above runs the unit specs; these are the assertions that need a
      # browser to mean anything.
      # The end-to-end specs drive a real page served by the real boundary
      # against the real schema, so the fixture has to be committed to the
      # database rather than seeded inside a rolled-back transaction — a
      # separate server process sees only committed rows.
      - name: Seed the frozen fixture
        env:
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
        run: uv run --directory src/api python tests/fixtures/frozen_run/seed.py

      - name: E2E (web)
        working-directory: src/web
        env:
          # The dedicated database `Seed the frozen fixture` just created. The
          # shared one still holds E005's dataset, which the model tier reads.
          E2E_DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement_e2e
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      # FR-040 / SC-017. The 1.5 s p95 is adopted from the registered
      # architecture document rather than chosen here, and a target nothing
      # measures cannot have its miss published.
      # SC-017, SC-018. The registered envelope is p95 ≤ 1.5 s on **one shared
      # vCPU**, so the measurement is taken under a one-CPU limit — a runner
      # with more cores that passes a single-vCPU target has measured a machine
      # nobody deploys on. `-s` so the published figures reach the log whether
      # the gate passes or fails: Principle VII requires the number, not just
      # the verdict.
      - name: Performance benchmark (api)
        env:
          DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
        run: |
          taskset -c 0 uv run --directory src/api python -m pytest \
            tests/test_worklist_benchmark.py \
            tests/test_retrieval_benchmark.py -q -s

      # OBJ1 VC6 says "when the application builds". Nothing built it, so the
      # criterion was unevidenced and a scaffold that could not compile would
      # have passed every other check.
      # Principle VII. The plan records a limitation reading "dependency
      # advisories are surfaced in CI and do not fail the build". That sentence
      # was false when written — no step surfaced them anywhere — and QC caught
      # it. This step is what makes the record true rather than aspirational.
      #
      # `continue-on-error` rather than a soft exit code, deliberately: security
      # is not among the project's required QC categories, so an advisory must
      # not block a merge, but the step's own status must still show as failed
      # in the run summary. A step that swallowed the exit code would report
      # green and bury the finding in a log nobody opens, which is the same
      # defect as not running it.
      - name: Dependency advisories (reported, not gated)
        continue-on-error: true
        # `cd` in a subshell rather than `npm audit --prefix`: npm rejects
        # `--prefix` on several subcommands, and this repository has already
        # been bitten by that once with `npm ci --prefix`.
        #
        # The status variable is what makes the comment above true. This step
        # used to end both commands with `|| true`, which is precisely the
        # "swallowed the exit code" defect that comment warns against: the step
        # exited zero, reported green, and `continue-on-error` had nothing to
        # act on. Four advisories sat unseen behind it.
        #
        # Dropping `|| true` outright is not the fix either. The runner uses
        # `bash -e`, so the first audit to find something would abort the step
        # and the second would never run — reproducing the same bug one command
        # to the right. Accumulating into `status` runs both and reports either.
        #
        # A failed audit and a found advisory both set it, deliberately: an
        # audit that could not reach its index produced no result, and reporting
        # green for that is the same lie as hiding a finding.
        run: |
          status=0
          echo "::group::npm audit (production dependencies of src/web)"
          ( cd src/web && npm audit --omit=dev ) || { status=1; echo "npm audit: advisories found, or the audit itself failed"; }
          echo "::endgroup::"
          echo "::group::pip-audit (src/api)"
          uv run --directory src/api --with pip-audit pip-audit || { status=1; echo "pip-audit: advisories found, or the audit itself failed"; }
          echo "::endgroup::"
          exit $status

      - name: Build (web)
        working-directory: src/web
        run: npm run build

      # The tag is resolved, never written out here. A literal in this step and
      # a matching literal in the check helpers is two copies of one name, and
      # the copies drift: the tag is daemon-wide, so on a machine holding
      # several checkouts of this repository the second build silently
      # re-points it and the first checkout's assertions then describe an image
      # built from source it has never seen — passing, about the wrong artifact.
      # `helpers/images.py` resolves a per-checkout tag and this step asks it
      # for the same value the assertions will ask for.
      #
      # The label is what makes a stale or foreign image detectable rather than
      # merely unlikely: `foreign_build()` refuses an image stamped with
      # somebody else's checkout path, and an unstamped one is reported too,
      # because unstamped is exactly what the old tooling produced.
      - name: Build serving image
        run: |
          set -euo pipefail
          TAG="$(uv run python -c 'from tests.checks.helpers.images import resolve_image_tag; print(resolve_image_tag())')"
          echo "building $TAG from $PWD"
          docker build \
            --label "com.procurement.checkout=$PWD" \
            -f src/api/Dockerfile -t "$TAG" src/

      - name: Cross-entry checks, image assertions, and supply chain
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.checks
        run: uv run coverage run -m pytest tests/checks -q

      # `combine` must succeed rather than be tolerated: if it silently fails,
      # the gate reports on one entry's data and passes on a partial
      # denominator. All entries pin one identical coverage version because
      # combine rejects a data-file schema mismatch.
      # SC-026 is two floors, not one. The aggregate is the first; the second is
      # `model.corpus` measured alone, because an aggregate over several packages
      # is an average — an already-covered package floats an uncovered new one
      # across the threshold, which is the exact failure the criterion was
      # written to prevent and which the aggregate alone cannot report.
      #
      # `--include` selects from the *combined* data rather than re-measuring, so
      # the second report costs nothing and cannot disagree with the first about
      # what ran. An unexecuted module still lands in this denominator at 0%:
      # the model step's `--source=…,src/model/corpus` records every importable
      # file under the package whether a test reached it or not, so a new module
      # nothing covers subtracts here instead of being averaged away.
      #
      # E006 adds three more per-package floors for the same reason SC-026 gave
      # for `model.corpus`, and the reason is arithmetic rather than style: a
      # single combined figure lets `roster`, `schema`, `corpus` and
      # `procurement` — already covered — carry a newly added package across the
      # threshold with none of its own lines exercised. That is precisely the
      # arithmetic that makes a coverage gate agree with adding untested code.
      # Each of `ingest`, `llm` and `compute` is therefore asserted alone.
      - name: Coverage gate
        run: |
          uv run coverage combine
          uv run coverage report --fail-under=80
          uv run coverage report --include='*/model/corpus/*' --fail-under=80
          uv run coverage report --include='*/model/ingest/*' --fail-under=80
          uv run coverage report --include='*/model/llm/*' --fail-under=80
          uv run coverage report --include='*/model/compute/*' --fail-under=80
          uv run coverage report --include='*/api/retrieval/*' --fail-under=80
          uv run coverage report --include='*/gateway/inference/*' --fail-under=80

  # ---------------------------------------------------------------------------
  # T088 / FR-074 — the replay reproduction job
  # ---------------------------------------------------------------------------
  #
  # **Which of the two possible jobs this is, stated plainly: it runs the
  # reachable portion of the replay pipeline and compares that.** It is not the
  # figure-level comparison FR-074 ultimately asks for, because that comparison
  # is not reachable from any committed artifact today, and a job that pretended
  # otherwise would be the worst of the three options — worse than no job.
  #
  # Why the figure-level comparison is unreachable. FR-074 measures reproduction
  # as "a replay-mode run from a clean checkout against the committed results
  # manifest". `specs/00006-document-ingestion-and-extraction/results-manifest.json`
  # is **not committed**: T089, which regenerates the report and the manifest, is
  # blocked on T081, and T081 is blocked because a fixture is a recorded provider
  # response and none can be produced without network access and a provider
  # credential. With zero fixtures committed, a replay run aborts at the first
  # synthetic transmittal with `fixture_missing` — which is the designed
  # behaviour (FR-045, FR-056), not a failure of it — so there are no figures for
  # a manifest to hold and nothing for a diff to compare.
  #
  # What is compared instead, and against what oracle. The run's own
  # per-document disposition ledger (FR-073) against an expectation derived from
  # the **committed corpus manifests** — not from a number typed into this file
  # and not from the run's own enumeration, either of which would let the run
  # grade its own homework. A corpus of R real documents and S synthetic ones,
  # replayed with no fixtures, must produce exactly: R `ingested`, 0
  # `skipped_unchanged`, 1 `rolled_back`, S−1 `not_reached`, exit code 3, and a
  # recorded `fixture_missing`. Anything else fails this job loudly. That covers
  # the reachable half of the pipeline — enumeration, hash verification,
  # identifier minting, chunking, embedding, the per-document transaction, the
  # skip decision, the abort and its record — which is every stage but the one
  # the missing fixtures gate.
  #
  # And when a manifest **is** committed, this job fails until it is finished.
  # That is deliberate rather than a trap: committing a results manifest means
  # figures exist to reproduce, and this job has no way to regenerate them (the
  # console entry emits no report). Failing then is the only outcome that does
  # not silently downgrade a figure-level gate to a ledger-level one.
  #
  # Cost, disclosed rather than hidden: this job chunks and embeds the whole real
  # layer before it reaches the abort, which is minutes of runner time on every
  # push. It is not gated on `verify` — a reproduction failure hidden behind an
  # unrelated lint error is a reproduction failure nobody sees — and it is not
  # scoped to release tags, because this workflow has no tag trigger and a job
  # wired to a trigger that never fires is the do-nothing job this comment
  # exists to rule out. Narrowing it to tags is a change to make when a tag
  # trigger exists, not before.
  reproduce:
    name: Replay reproduction (FR-074)
    runs-on: ubuntu-latest

    # The same digest-pinned image, credentials and health check the `verify`
    # job's service carries, for the same reason: a reproduction measured
    # against a different server than the one the suite runs on is a
    # reproduction of something else. Copied from the Compose `db` service
    # (AD-001); update the pin there and copy it here.
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: procurement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procurement -d procurement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://procurement:local-development-only@localhost:5432/procurement
      # TR-048: every invocation is priced, replay included — a replayed one from
      # the fixture's recorded token counts. The value is `price_table_version.
      # version_id` as E003's revision 0103 seeds it. A stale literal here fails
      # this job loudly rather than quietly: the gateway refuses a pin that
      # resolves to no version *before* it builds a request, so the run would
      # abort as `provider_unreachable` and the comparison below would report a
      # disposition ledger that does not match.
      GATEWAY_PRICE_TABLE_VERSION: "2026-07-26-published"
      # FR-038: the build revision the run records. Supplied rather than left to
      # `git rev-parse` because `actions/checkout` leaves a detached HEAD whose
      # commit is exactly this, and because the ingestion entry refuses a run it
      # cannot attribute rather than recording a placeholder.
      INGEST_VCS_REVISION: ${{ github.sha }}
      # project-instructions.md v1.2.5: scratch stays inside the checkout.
      TMPDIR: ${{ github.workspace }}/.tmp
      TEMP: ${{ github.workspace }}/.tmp
      TMP: ${{ github.workspace }}/.tmp
      # v1.2.6, narrowed by v1.2.8: Numba keeps private scratch that `tempfile`
      # and the three above never reach. PyTensor's `base_compiledir` is
      # deliberately NOT redirected — it holds a compiled C++ extension, not
      # scratch, and pinning it made every checkout rebuild the same binary.
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.tmp/numba

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Only the modeling entry. The ingestion job is a console entry point of
      # that entry (ADR-0011), so nothing here needs the web tier, the serving
      # image, or the gateway's provider extra — `replay` reaches no provider.
      - name: Sync the modeling entry against its lockfile
        run: |
          mkdir -p "$TMPDIR"
          uv sync --locked --directory src/model

      - name: Apply the migration chain (model)
        run: uv run --directory src/model migrate

      # `set +e` around the run and not `set -e`: a non-zero exit is the expected
      # outcome while T081 is open, and the comparison step is what judges it. A
      # step that failed here would report "the run failed" for a run that did
      # exactly what it is currently supposed to do.
      - name: Replay-mode run from the clean checkout
        run: |
          set -uo pipefail
          mkdir -p "$TMPDIR"
          status=0
          uv run --directory src/model ingest --mode replay \
            >"$TMPDIR/replay.out" 2>"$TMPDIR/replay.err" || status=$?
          echo "$status" >"$TMPDIR/replay.status"
          echo "--- stdout ---"; cat "$TMPDIR/replay.out"
          echo "--- stderr ---"; cat "$TMPDIR/replay.err"
          echo "--- exit code: $status ---"

      # Standard library only, and `python3` rather than an entry's environment:
      # this step reads two JSON files and three text files, and pulling in a
      # project environment to do it would make the comparison depend on the
      # thing it is comparing.
      - name: Compare the run against the committed results manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          scratch = pathlib.Path(os.environ["TMPDIR"])
          manifest = pathlib.Path(
              "specs/00006-document-ingestion-and-extraction/results-manifest.json"
          )
          failures = []

          def fail(message):
              failures.append(message)
              print(f"::error::{message}")

          out = (scratch / "replay.out").read_text(encoding="utf-8")
          err = (scratch / "replay.err").read_text(encoding="utf-8")
          status = int((scratch / "replay.status").read_text(encoding="utf-8").strip())

          # The oracle: the committed corpus manifests, read independently of the
          # run. Deriving it from the run's own enumeration would compare the run
          # with itself and pass for any corpus at all.
          layers = {}
          for path in sorted(pathlib.Path("data/corpus").rglob("manifest.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              layers[payload["layer"]] = layers.get(payload["layer"], 0) + len(payload["entries"])
          real = layers.get("REAL", 0)
          synthetic = layers.get("SYNTHETIC", 0)
          if real < 1 or synthetic < 2:
              fail(
                  f"the corpus oracle enumerated REAL={real} SYNTHETIC={synthetic}; a "
                  f"comparison against an empty or one-document layer passes for no reason "
                  f"(FR-068)"
              )

          printed = re.search(r"^ingest: dispositions (.+) enumerated=(\d+)\s*$", out, re.M)
          if printed is None:
              fail(
                  "the replay run printed no disposition ledger, so there is nothing to "
                  "compare; it did not reach the write stage at all"
              )
          observed = {}
          enumerated = -1
          if printed is not None:
              observed = dict(
                  (name, int(value))
                  for name, value in (pair.split("=") for pair in printed.group(1).split())
              )
              enumerated = int(printed.group(2))

          if manifest.exists():
              # The figure-level gate FR-074 states. Unreachable from this job:
              # the console entry emits no report, so there is nothing to
              # regenerate the manifest from and nothing to diff. Failing is the
              # only honest outcome — passing would downgrade a figure-level gate
              # to a ledger-level one without saying so.
              fail(
                  f"{manifest} is committed, so figures exist that FR-074 requires this job "
                  f"to reproduce — and this job cannot: the `ingest` console entry emits no "
                  f"report, so there is nothing here to regenerate the manifest from. Wire "
                  f"the report emitter into the entry and diff the regenerated manifest "
                  f"against the committed one before committing it (T089)."
              )
          else:
              # The reachable portion, while T081 leaves the fixture store empty.
              expected = {
                  "ingested": real,
                  "skipped_unchanged": 0,
                  "rolled_back": 1,
                  "not_reached": synthetic - 1,
              }
              if status != 3:
                  fail(
                      f"the replay run exited {status}; with no fixtures committed (T081) it "
                      f"must abort part-way and exit 3. 0 would mean it reached extraction, "
                      f"which no committed fixture can satisfy; 2 would mean it was refused "
                      f"before writing anything."
                  )
              if "fixture_missing" not in err:
                  fail(
                      "the replay run did not abort with `fixture_missing`. That is the one "
                      "run-level kind an empty fixture store produces (FR-045, FR-056); any "
                      "other kind means the run stopped for a different reason and this "
                      "comparison is measuring something else."
                  )
              if observed != expected:
                  fail(
                      f"the disposition ledger is {observed}, and the committed corpus "
                      f"(REAL={real}, SYNTHETIC={synthetic}) requires {expected}"
                  )
              if enumerated != real + synthetic:
                  fail(
                      f"the run enumerated {enumerated} documents and the committed manifests "
                      f"hold {real + synthetic}"
                  )

          if failures:
              print(f"reproduction FAILED: {len(failures)} check(s)")
              sys.exit(1)
          print(
              f"reproduction held over the reachable portion: {observed}, enumerated "
              f"{enumerated}, exit {status}, aborted on `fixture_missing`. The figure-level "
              f"comparison FR-074 states is NOT covered — no results manifest is committed "
              f"(T089, blocked on T081)."
          )
          PY
