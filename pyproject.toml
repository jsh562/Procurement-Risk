[project]
name = "procurement-risk-checks"
version = "0.1.0"
description = "Cross-entry verification harness and aggregated coverage gate"
requires-python = ">=3.12"
dependencies = []

# Deliberately NOT a uv workspace. A workspace resolves one dependency graph
# across its members and cannot stop one member importing another's
# dependencies — the exact property the four entries exist to guarantee.
# The entries under /src are independent projects; this root project owns only
# the cross-entry checks that have no single owning entry.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage==7.15.2", # HINT-003: identical across all entries; combine rejects a version mismatch
    "ruff>=0.16.0",
    "packaging>=26.2",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest's scratch inside the checkout. Without this it derives its base
# temp from `tempfile.gettempdir()`, which on Windows is %LOCALAPPDATA%\Temp —
# where a build's unsigned compiler probes and a 1 GB throwaway environment
# once tripped the machine's antivirus as a dropper. `.tmp/` is gitignored, and
# pytest clears its own basetemp at start, so nothing else may live there.
# Belt and braces with the TMPDIR rule in AGENTS.md: this holds even when a
# command is run without it.
#
# **This tier needed it most and was the one without it.** All three entries
# under `/src` pinned it and the root did not — v1.2.5 spells the obligation as
# "each entry's pytest configuration" and the cross-entry harness is not an
# entry, which is exactly how it was missed. Meanwhile the only pytest code in
# the repository that builds a *virtual environment* lives here —
# `tests/checks/test_gateway_no_provider_env.py` constructs one through
# `tmp_path_factory`, which resolves through this setting. So the tier that
# would have put an unsigned install in the system temp directory was the one
# tier not stopped from doing it.
#
# The path is relative to the invocation directory rather than to rootdir,
# which is what pytest does with `--basetemp`; every step that runs this tier
# runs from the repository root. The entries spell it `../../.tmp/pytest`
# because they run from `src/<entry>`, and all four therefore name one
# directory.
addopts = "--basetemp=.tmp/pytest"

[tool.coverage.run]
branch = true
# Every Python package in the repository that ships executable runtime code.
# Configuration is not coverable and `src/api` ships none yet -- three empty
# `__init__.py` files -- so a literally repository-wide denominator would report
# a number that means nothing.
#
# `src/gateway` was excluded here until E003's QC, under a comment claiming that
# two of the four entries ship no runtime code. That was true of `src/api` and
# false of `src/gateway`, which ships `provider.py` -- the single permitted
# provider import site, the most load-bearing module in the repository -- with
# five tests that CI already runs. It was measured by nothing, and the comment
# asserting otherwise is what kept anyone from noticing. Adding it requires the
# gateway test step to run under `coverage run` with its own COVERAGE_FILE, or
# its statements land in the denominator with no hits; see the step in
# `.github/workflows/verify.yml`. All entries pin coverage==7.15.2 because
# `combine` rejects a data-file version mismatch.
#
# `model.procurement` was added with E005 (T001). It is listed here *and* given
# a `[tool.coverage.paths]` entry below because E003's QC proved the failure
# mode: a package absent from `source` still reaches the denominator through
# the model step's own data file, lands there with zero hits, and drags the
# combined percentage down while measuring nothing. The two settings are one
# change, not two.
#
# `model.ingest`, `model.llm` and `model.compute` were added with E006, under
# the same "one change, not two" rule -- they were the three packages the epic
# named in the model step's `--source` and in four per-package coverage floors
# while appearing in neither setting here. Nothing was wrong today, because the
# model step's explicit `--source` puts them in the combined data with their
# real hits. What was wrong is that the rule this list states -- every package
# shipping executable runtime code -- had three exceptions nothing recorded, so
# the day the model step loses its explicit scope these three leave the
# denominator altogether. That direction is the worse one: an absent package is
# not measured at all rather than measured badly.
source = [
    "tests/checks/helpers",
    "src/model/src/model/roster",
    "src/model/src/model/schema",
    "src/model/src/model/corpus",
    "src/model/src/model/procurement",
    "src/model/src/model/ingest",
    "src/model/src/model/llm",
    "src/model/src/model/compute",
    "src/gateway/src/gateway",
]

[tool.coverage.paths]
# Each entry writes its own data file from its own working directory; these
# map the differing roots onto one path so `combine` merges rather than
# double-counts.
helpers = ["tests/checks/helpers", "*/tests/checks/helpers"]
roster = ["src/model/src/model/roster", "*/src/model/roster"]
schema = ["src/model/src/model/schema", "*/src/model/schema"]
# Added with E002. It works today without this entry only because the model
# step passes an explicit `--source` and the data file holds absolute paths, so
# the mapping is never consulted -- an accident that ends the moment anyone
# sets `relative_files` or the step loses its explicit scope.
corpus = ["src/model/src/model/corpus", "*/src/model/corpus"]
# Added with E005, alongside the `source` entry above. Same reasoning as
# `corpus`: the mapping is not consulted today because the model step passes an
# explicit `--source` and the data file holds absolute paths, and it is written
# anyway so the package is not the one that breaks when that stops being true.
procurement = ["src/model/src/model/procurement", "*/src/model/procurement"]
# Added with E006. Same reasoning as `corpus` and `procurement` above, and the
# same reason for writing them now rather than when they break: the model step
# passes an explicit `--source` naming all seven packages and the data file
# holds absolute paths, so the mapping is not consulted today. It is consulted
# the moment anyone sets `relative_files` or the step loses its explicit scope,
# and the package with no entry here is the one that silently double-counts
# then. Three packages, three entries — a mapping that covered six of the nine
# packages in `source` above would be a rule stated for some of them.
#
# Paired with the three added to `[tool.coverage.run] source` above in the same
# change, per the "one change, not two" rule recorded there. `verify.yml`'s
# coverage gate additionally asserts each of the three alone at 80%, which is
# the arithmetic reason they cannot be left to an aggregate.
ingest = ["src/model/src/model/ingest", "*/src/model/ingest"]
llm = ["src/model/src/model/llm", "*/src/model/llm"]
compute = ["src/model/src/model/compute", "*/src/model/compute"]
gateway = ["src/gateway/src/gateway", "*/src/gateway"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
