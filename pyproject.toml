[project]
name = "procurement-risk-checks"
version = "0.1.0"
description = "Cross-entry verification harness and aggregated coverage gate"
requires-python = ">=3.12"
dependencies = []

# Deliberately NOT a uv workspace. A workspace resolves one dependency graph
# across its members and cannot stop one member importing another's
# dependencies — the exact property the four entries exist to guarantee.
# The entries under /src are independent projects; this root project owns only
# the cross-entry checks that have no single owning entry.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage==7.15.2", # HINT-003: identical across all entries; combine rejects a version mismatch
    "ruff>=0.16.0",
    "packaging>=26.2",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# Every Python package in the repository that ships executable runtime code.
# Configuration is not coverable. `src/api` joined this list with E010, which
# is the first feature to put runtime code there; before that it held three
# empty `__init__.py` files and counting them would have reported a number
# that meant nothing.
#
# `src/gateway` was excluded here until E003's QC, under a comment claiming that
# two of the four entries ship no runtime code. That was true of `src/api` and
# false of `src/gateway`, which ships `provider.py` -- the single permitted
# provider import site, the most load-bearing module in the repository -- with
# five tests that CI already runs. It was measured by nothing, and the comment
# asserting otherwise is what kept anyone from noticing. Adding it requires the
# gateway test step to run under `coverage run` with its own COVERAGE_FILE, or
# its statements land in the denominator with no hits; see the step in
# `.github/workflows/verify.yml`. All entries pin coverage==7.15.2 because
# `combine` rejects a data-file version mismatch.
#
# `model.procurement` was added with E005 (T001). It is listed here *and* given
# a `[tool.coverage.paths]` entry below because E003's QC proved the failure
# mode: a package absent from `source` still reaches the denominator through
# the model step's own data file, lands there with zero hits, and drags the
# combined percentage down while measuring nothing. The two settings are one
# change, not two.
#
# `model.forecast` was added with E007 (T001) under that same rule, in both
# places in the same change. E003 and E005 each recorded the halves as one
# change; adding the third package is where a note that has now been written
# twice either holds or was never worth writing.
source = [
    "tests/checks/helpers",
    "src/model/src/model/roster",
    "src/model/src/model/schema",
    "src/model/src/model/corpus",
    "src/model/src/model/procurement",
    "src/model/src/model/forecast",
    "src/gateway/src/gateway",
    "src/api/src/api",
]

[tool.coverage.paths]
# Each entry writes its own data file from its own working directory; these
# map the differing roots onto one path so `combine` merges rather than
# double-counts.
helpers = ["tests/checks/helpers", "*/tests/checks/helpers"]
roster = ["src/model/src/model/roster", "*/src/model/roster"]
schema = ["src/model/src/model/schema", "*/src/model/schema"]
# Added with E002. It works today without this entry only because the model
# step passes an explicit `--source` and the data file holds absolute paths, so
# the mapping is never consulted -- an accident that ends the moment anyone
# sets `relative_files` or the step loses its explicit scope.
corpus = ["src/model/src/model/corpus", "*/src/model/corpus"]
# Added with E005, alongside the `source` entry above. Same reasoning as
# `corpus`: the mapping is not consulted today because the model step passes an
# explicit `--source` and the data file holds absolute paths, and it is written
# anyway so the package is not the one that breaks when that stops being true.
procurement = ["src/model/src/model/procurement", "*/src/model/procurement"]
# Added with E007, alongside the `source` entry above. Same reasoning as
# `corpus` and `procurement`.
forecast = ["src/model/src/model/forecast", "*/src/model/forecast"]
gateway = ["src/gateway/src/gateway", "*/src/gateway"]
api = ["src/api/src/api", "*/src/api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
