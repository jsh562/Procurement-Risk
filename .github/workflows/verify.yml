name: verify

# All three triggers, deliberately.
#
# `push` is what makes the architecture contracts real: a violation fails the
# build rather than raising a review comment. This was originally deferred to a
# later epic as a scope decision, then closed here once the analyze phase made
# the cost visible — it is one line.
#
# `pull_request` (FR-034) makes the merge gate authoritative: a push run and a
# pull-request run may cover the same head commit, but they are independent runs
# scoped by ref, and the pull-request one is what judges the merge.
#
# `pull_request` and NOT `pull_request_target` (FR-034a(b)). The two are not
# interchangeable spellings: `pull_request_target` runs the *base* ref's
# workflow definition with the base repository's token and secret access while
# checking out head content, which is a different execution surface from the one
# FR-034a states. What runs here is the proposed head content under a
# `contents: read` token with no secret in reach (FR-034a(a), (c)), so the
# reachable consequence of a hostile head is bounded to a wrong verdict on its
# own pull request. tests/checks/test_workflow_triggers.py asserts all three of
# those properties against this file.
#
# `workflow_dispatch` remains because the violation-injection input below is
# on-demand evidence, not something to run on every push.
on:
  push:
    # Specification artifacts cannot change any check's outcome — nothing under
    # tests/, src/*/tests/, or the check harness reads specs/. Verified before
    # adding this rather than assumed.
    #
    # Deliberately NOT `**.md`: data/roster/roster-datasheet.md is asserted by
    # src/model/tests/test_roster_datasheet.py for its required sections, the
    # literal SYNTHETIC token, and VR-016's no-literal-digest rule. A blanket
    # Markdown ignore would silently stop verifying a file that is under test.
    paths-ignore:
      - "specs/**"
      - "README.md"
  # Against the default branch, named explicitly rather than left to the
  # `pull_request` default of "any base ref" — FR-034 states the base, and the
  # committed trigger check reads this list to assert it.
  #
  # No `paths-ignore` here, unlike `push` above, and the asymmetry is the point.
  # A skipped push run costs nothing; a pull-request run that is skipped by path
  # filtering reports no status at all, and a required check with no status
  # leaves the pull request pending forever rather than passing. The merge gate
  # therefore runs on every pull request, including a specs-only one.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      inject_violation:
        description: "Plant a contract violation to evidence the checks fail"
        type: choice
        required: false
        default: none
        options:
          - none
          - provider-import
          - computation-boundary

permissions:
  contents: read

# When commits land close together on one ref, the older run is verifying code
# that no longer exists. Grouped by ref so `main` and a feature branch never
# cancel each other.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build environment sits behind TLS interception; without this every
  # index request fails with UnknownIssuer rather than a network error.
  UV_NATIVE_TLS: "1"
  # import-linter renders an emoji through `rich`. On Windows with a non-TTY
  # stdout, rich falls back to a cp1252 legacy console encoder, raises
  # UnicodeEncodeError, and exits 1 with no visible output — a passing contract
  # that reports as broken. Linux runners are unaffected, so this is set for
  # anyone reusing these steps on a Windows runner rather than for CI itself.
  PYTHONUTF8: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The violation is written into the checked-out working tree of an
      # ephemeral runner and never committed — TR-022's prohibition is on
      # committing a violation to a production contract root, which would make
      # the clean-tree run fail permanently, not on materialising one at runtime.
      #
      # It is written into the production root deliberately rather than a
      # scratch copy: the contracts run against the real root, so a violation
      # placed anywhere else would not be seen and the run would pass, proving
      # nothing. An earlier comment here claimed a scratch copy that did not
      # exist; the mechanism is described accurately now.
      - name: Plant violation in the runner's working tree (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_violation != 'none' }}
        run: |
          set -euo pipefail
          # Each payload must be lint-clean while still breaking its contract.
          # A bare `import anthropic` is F401 (imported but unused), so ruff
          # fails three steps before the contracts run and the dispatch names
          # "Lint (Python)" instead of the violated contract — a run that fails
          # for the wrong reason is not evidence that the contract works.
          # The `__all__` line is what makes the import "used".
          case "${{ inputs.inject_violation }}" in
            provider-import)
              target=src/gateway/src/gateway/_injected.py
              printf 'import anthropic\n\n__all__ = ["anthropic"]\n' > "$target" ;;
            computation-boundary)
              target=src/api/src/api/llm/_injected.py
              printf 'from api import compute\n\n__all__ = ["compute"]\n' > "$target" ;;
          esac
          echo "Planted violation at $target"
          # Confirm the file exists rather than asking git. The injected file is
          # untracked, `git diff` does not report untracked files, so a
          # `git diff --quiet` guard fires on the success path and kills the
          # step — the dispatch evidence path would fail at injection and never
          # reach the contracts it exists to trip.
          test -s "$target" || { echo "::error::injection wrote nothing to $target"; exit 1; }

      - name: Sync every Python entry against its own lockfile
        run: |
          for entry in gateway api model; do
            uv sync --locked --directory "src/$entry"
          done
          uv sync

      # Separate step with working-directory rather than `npm ci --prefix`:
      # `npm ci` rejects --prefix outright with a usage error, which fails the
      # step before any check runs and reads as a broken build rather than a
      # broken command line.
      - name: Sync the web boundary against its lockfile
        working-directory: src/web
        run: npm ci

      - name: Lock verification
        run: |
          for entry in gateway api model; do uv lock --check --directory "src/$entry"; done

      - name: Lint (Python)
        run: |
          for entry in gateway api model; do uv run --directory "src/$entry" ruff check .; done
          uv run ruff check .

      - name: Format check (Python)
        run: |
          for entry in gateway api model; do
            uv run --directory "src/$entry" ruff format --check .
          done

      - name: Lint and format check (web)
        working-directory: src/web
        run: |
          npm run lint
          npx prettier --check .

      - name: Type check (web)
        working-directory: src/web
        run: npx tsc --noEmit

      - name: Architecture contracts
        run: |
          for entry in gateway api model; do uv run --directory "src/$entry" lint-imports; done

      # Each entry writes its own coverage data file. pytest-cov overrides the
      # `parallel` setting, so the files are kept apart by COVERAGE_FILE rather
      # than by configuration, and combined at the root below.
      - name: Unit tests (model)
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.model
        working-directory: src/model
        run: uv run coverage run --source=src/model/roster,src/model/corpus -m pytest tests -q

      # FR-017: corpus validation runs automatically, not on demand. The console
      # entry point is the same one a developer runs, so a green CI run and a
      # green local run are the same assertion.
      #
      # **Unscoped, deliberately.** This step carried `--layer REAL` while the
      # synthetic layer did not exist, because VR-005 and VR-066 are built to
      # fail on a corpus missing it — that is their entry-criterion job, not a
      # defect to suppress. The layer landed with T056's single generation run,
      # and the flag came off in the same change: left in place it would make
      # the required check silently blind to all 25 synthetic documents and to
      # the seventeen rules asserted only over them.
      - name: Corpus validation
        run: uv run --directory src/model corpus-validate

      # The gateway holds the single permitted provider import site. Its tests
      # existed but no step ran them, so OBJ7's "every check runs" was false
      # for the most load-bearing module in the repository.
      - name: Unit tests (gateway)
        run: uv run --directory src/gateway python -m pytest tests -q

      - name: Unit tests (web)
        working-directory: src/web
        run: npm test

      # OBJ1 VC6 says "when the application builds". Nothing built it, so the
      # criterion was unevidenced and a scaffold that could not compile would
      # have passed every other check.
      - name: Build (web)
        working-directory: src/web
        run: npm run build

      - name: Build serving image
        run: docker build -f src/api/Dockerfile -t procurement-api:e001 src/

      - name: Cross-entry checks, image assertions, and supply chain
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.checks
        run: uv run coverage run -m pytest tests/checks -q

      # `combine` must succeed rather than be tolerated: if it silently fails,
      # the gate reports on one entry's data and passes on a partial
      # denominator. All entries pin one identical coverage version because
      # combine rejects a data-file schema mismatch.
      - name: Coverage gate
        run: |
          uv run coverage combine
          uv run coverage report --fail-under=80
